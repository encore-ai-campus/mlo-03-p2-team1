services:
  postgres:
    image: postgres:18-alpine
    container_name: apartapart-postgres
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${DBNAME:-web}
      POSTGRES_USER: ${DBID:-web}
      POSTGRES_PASSWORD: ${DBPW:-qwer1234}
    ports:
      - "${LOCAL_DBPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBID:-web} -d ${DBNAME:-web}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: apartapart-backend
    env_file:
      - path: .env
        required: false
    environment:
      DBHOST: ${DBHOST:-100.100.100.60}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-web}
      DBID: ${DBID:-web}
      DBPW: ${DBPW:-}
      DBSSLMODE: ${DBSSLMODE:-prefer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: apartapart-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
